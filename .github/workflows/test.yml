name: Transport regression

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  linux-python312:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies with an existing curl_cffi client
        run: python -m pip install -r requirements.txt curl_cffi==0.16.2
      - name: Functional and real SDK transport tests
        run: python -m unittest discover -s tests -v
      - name: Real SDK heartbeat and connection soak
        run: python tests/soak_transport.py
